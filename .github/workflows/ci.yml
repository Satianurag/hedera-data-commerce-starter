name: Verify template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-and-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEDERA_NETWORK: testnet
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run verify
      - name: Stage Linux standalone artifact
        run: node deploy/testnet/stage-app.mjs

  go-adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: go1.26.8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
          cache-dependency-path: packages/neuron-go/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Check local Go adapters
        working-directory: packages/neuron-go
        run: |
          go test ./...
          go vet ./...
      - name: Build pinned reference adapter
        env:
          NEURON_REFERENCE_CACHE: ${{ runner.temp }}/neuron-reference
        run: node packages/neuron-reference/scripts/prepare.mjs
      - name: Check reference overlay
        working-directory: ${{ runner.temp }}/neuron-reference/source/impl/golang
        run: |
          go test ./cmd/scaffold-reference
          go vet ./cmd/scaffold-reference
